[project]
name = "sporeprint-server"
version = "5.0.0"
requires-python = ">=3.11"
dependencies = [
    # v3.4.9 — cap-only pins matching cloud/pyproject.toml policy (L-3).
    # Floor is the tested minimum; ceiling is the next known-breaking
    # major. A future FastAPI 1.x or Pydantic 3.x cannot land silently on
    # `pip install -U` without a deliberate cap bump + test run.
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    "aiomqtt>=2.0,<3.0",
    # Security floors (2026-09 audit): socketio 5.16.2 / engineio 4.13.2
    # fix binary-attachment + payload-size DoS; multipart 0.0.31 fixes the
    # header / querystring / negative Content-Length DoS + smuggling set;
    # pydantic-settings 2.14.2 fixes secrets_dir symlink escape.
    "python-socketio>=5.16.2,<6.0",
    "python-engineio>=4.13.2,<5.0",
    # anthropic 1.x (httpx2-based). Only plain AsyncAnthropic(api_key=...)
    # .messages.create(model, max_tokens, system, messages) is used — none of
    # the parameters/aliases 1.0 removed.
    "anthropic>=1.8,<2.0",
    "httpx>=0.27,<1.0",
    # Pillow does not backport fixes; 12.3.0 closes the 11.x/12.x OOB-write
    # and decompression-bomb advisories. Only reached via qrcode labels.
    "pillow>=12.3,<13.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "python-multipart>=0.0.31,<1.0",
    # Transitive (FastAPI / httpx) but security-relevant, so floored here:
    # starlette < 1.0.1 lets a crafted Host header poison request.url.path
    # and skip ApiKeyMiddleware's public-path check (GHSA-86qp-5c8j-p5mr);
    # 1.3.1 also fixes the form-limit DoS. anyio 4.14.2 fixes TLS host-name
    # spoofing (GHSA-82r6-8w77-94w6).
    "starlette>=1.3.1,<2.0",
    "anyio>=4.14.2,<5.0",
    "psutil>=5.9,<8.0",
    "qrcode[pil]>=7.4,<9.0",
    "icalendar>=5.0,<7.0",
    # OTA self-update: Ed25519 detached-signature verification of firmware
    # bundles fetched from updates.sporeprint.ai. cryptography ships with
    # vetted, constant-time Ed25519 — much safer than a hand-rolled
    # implementation (per the project's secure-by-default policy).
    # Floor 50.0.1: pyca patches only the latest release, and <48.0.1 wheels
    # bundle a vulnerable OpenSSL (GHSA-537c-gmf6-5ccf). The Ed25519 / Fernet
    # / AES-CBC APIs used here are unchanged across 41–50.
    "cryptography>=50.0.1,<51.0",
    # v4.1 Grafana integration — Prometheus text-format exposition for
    # users who run their own Grafana + Prometheus on the LAN. The
    # exporter at /metrics queries telemetry on each scrape, so there is
    # no in-memory state to leak; a stale Pi just stops emitting samples.
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
vision = ["tflite-runtime", "onnxruntime", "numpy", "opencv-python-headless"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
