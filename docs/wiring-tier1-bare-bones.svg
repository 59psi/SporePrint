<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">

  <!-- Background -->
  <rect width="900" height="700" fill="#0a0a0f"/>

  <!-- ═══════════════════════ TITLE ═══════════════════════ -->
  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Tier 1: Bare Bones Wiring Diagram</text>
  <text x="450" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">ESP32 + two I2C sensors on one STEMMA QT chain: no soldering, no breadboard. Pi and smart plug connect over WiFi only.</text>

  <!-- ═══════════════════════ WIRE LEGEND ═══════════════════════ -->
  <rect x="680" y="62" width="206" height="98" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="783" y="80" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">STEMMA QT Wire Colours</text>

  <line x1="694" y1="98" x2="724" y2="98" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="732" y="102" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="9">RED = 3.3V Power</text>

  <line x1="694" y1="116" x2="724" y2="116" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <text x="732" y="120" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="9">BLACK = Ground</text>

  <line x1="694" y1="134" x2="724" y2="134" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <text x="732" y="138" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="9">BLUE = SDA (I2C data)</text>

  <line x1="694" y1="152" x2="724" y2="152" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
  <text x="732" y="156" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="9">YELLOW = SCL (I2C clock)</text>


  <!-- ═══════════════════════ RASPBERRY PI 5 (top-left callout) ═══════════════════════ -->
  <rect x="24" y="80" width="220" height="106" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="134" y="104" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Raspberry Pi 5</text>
  <text x="134" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Runs SporePrint server</text>
  <text x="134" y="138" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">+ credentialed MQTT broker</text>

  <!-- WiFi icon -->
  <path d="M 112 160 Q 112 152 120 152" fill="none" stroke="#34d399" stroke-width="1.2"/>
  <path d="M 106 164 Q 106 148 120 148" fill="none" stroke="#34d399" stroke-width="1.2"/>
  <circle cx="120" cy="160" r="2" fill="#34d399"/>

  <rect x="130" y="152" width="100" height="20" rx="4" fill="#0f2418" stroke="#34d399" stroke-width="0.5"/>
  <text x="180" y="166" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">WiFi to ESP32</text>

  <!-- Pi note -->
  <rect x="14" y="198" width="240" height="28" rx="4" fill="#0a0a0f" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="134" y="216" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">No wires to ESP32 -- they talk over WiFi</text>


  <!-- ═══════════════════════ TASMOTA PLUG (left callout) ═══════════════════════ -->
  <rect x="24" y="248" width="220" height="122" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="134" y="272" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Athom Tasmota Plug</text>
  <text x="134" y="290" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Controls the humidifier via MQTT</text>
  <text x="134" y="306" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">User sp-3p, Topic humidifier</text>
  <text x="134" y="320" text-anchor="middle" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="9">Full Topic tasmota/%topic%/%prefix%/</text>

  <!-- WiFi icon -->
  <path d="M 112 344 Q 112 336 120 336" fill="none" stroke="#34d399" stroke-width="1.2"/>
  <path d="M 106 348 Q 106 332 120 332" fill="none" stroke="#34d399" stroke-width="1.2"/>
  <circle cx="120" cy="344" r="2" fill="#34d399"/>

  <rect x="130" y="336" width="100" height="20" rx="4" fill="#0f2418" stroke="#34d399" stroke-width="0.5"/>
  <text x="180" y="350" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">WiFi to Pi</text>

  <!-- Plug note -->
  <rect x="14" y="380" width="240" height="28" rx="4" fill="#0a0a0f" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="134" y="398" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Plug the humidifier in -- no wiring needed</text>


  <!-- ═══════════════════════ ESP32 DEVKIT (WROOM-32) (center) ═══════════════════════ -->
  <rect x="290" y="80" width="200" height="310" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <text x="390" y="106" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">ESP32-WROOM-32 DevKit</text>
  <text x="390" y="124" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Climate node (env node_esp32)</text>

  <!-- USB-C power indicator -->
  <rect x="330" y="140" width="120" height="24" rx="4" fill="#0a0a0f" stroke="#475569" stroke-width="0.5"/>
  <text x="390" y="156" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">USB-C (5V power + flashing)</text>

  <!-- Pin header visual (right side) -->
  <rect x="472" y="182" width="14" height="190" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>

  <!-- 3V3 -->
  <circle cx="479" cy="204" r="6" fill="#ef4444" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="464" y="200" text-anchor="end" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">3V3</text>
  <text x="464" y="214" text-anchor="end" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="9">red socket</text>

  <!-- GND -->
  <circle cx="479" cy="252" r="6" fill="#1e1e1e" stroke="#6b7280" stroke-width="1"/>
  <text x="464" y="248" text-anchor="end" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">GND</text>
  <text x="464" y="262" text-anchor="end" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="9">any GND (not EN)</text>

  <!-- GPIO21 (SDA) -->
  <circle cx="479" cy="304" r="6" fill="#3b82f6" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="464" y="300" text-anchor="end" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">GPIO 21</text>
  <text x="464" y="314" text-anchor="end" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="9">SDA</text>

  <!-- GPIO22 (SCL) -->
  <circle cx="479" cy="354" r="6" fill="#eab308" stroke="#fde047" stroke-width="0.5"/>
  <text x="464" y="350" text-anchor="end" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">GPIO 22</text>
  <text x="464" y="364" text-anchor="end" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="9">SCL</text>


  <!-- ═══════════════════════ SHT31-D SENSOR (upper-right) ═══════════════════════ -->
  <rect x="640" y="180" width="210" height="100" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="745" y="206" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">SHT31-D</text>
  <text x="745" y="224" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Temperature + Humidity</text>
  <text x="745" y="242" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9">I2C address: 0x44</text>
  <!-- QT port (left) -->
  <rect x="628" y="214" width="16" height="26" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="662" y="266" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="8">QT in (left) / QT out (bottom)</text>


  <!-- ═══════════════════════ BH1750 SENSOR (lower-right) ═══════════════════════ -->
  <rect x="640" y="330" width="210" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="745" y="358" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">BH1750</text>
  <text x="745" y="376" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Ambient Light (lux)</text>
  <text x="745" y="394" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9">I2C address: 0x23</text>


  <!-- ═══════════════════════ CABLE 1: Adafruit 4397 (ESP32 pins -> SHT31-D QT) ═══════════════════════ -->
  <path d="M 485 204 L 560 204 L 560 218 L 628 218" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <path d="M 485 252 L 572 252 L 572 224 L 628 224" fill="none" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <path d="M 485 304 L 584 304 L 584 230 L 628 230" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 485 354 L 596 354 L 596 236 L 628 236" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
  <g>
    <rect x="500" y="150" width="136" height="36" rx="4" fill="#0a0a0f" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="568" y="165" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Adafruit 4397 cable</text>
    <text x="568" y="179" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">female sockets → QT plug</text>
  </g>


  <!-- ═══════════════════════ CABLE 2: Adafruit 4210 QT-QT (SHT31-D -> BH1750) ═══════════════════════ -->
  <line x1="733" y1="280" x2="733" y2="330" stroke="#ef4444" stroke-width="3"/>
  <line x1="741" y1="280" x2="741" y2="330" stroke="#4b5563" stroke-width="3"/>
  <line x1="749" y1="280" x2="749" y2="330" stroke="#3b82f6" stroke-width="3"/>
  <line x1="757" y1="280" x2="757" y2="330" stroke="#eab308" stroke-width="3"/>
  <g>
    <rect x="766" y="290" width="104" height="30" rx="4" fill="#0a0a0f" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="818" y="303" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Adafruit 4210</text>
    <text x="818" y="315" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">QT-QT cable</text>
  </g>


  <!-- ═══════════════════════ CHAIN NOTE ═══════════════════════ -->
  <rect x="500" y="374" width="128" height="50" rx="6" fill="#0a0a0f" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="564" y="392" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">One chain, not a star</text>
  <text x="564" y="406" text-anchor="middle" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="8">ESP32 → SHT31-D → BH1750</text>
  <text x="564" y="418" text-anchor="middle" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="8">different addresses</text>


  <!-- ═══════════════════════ WIRING STEP LIST ═══════════════════════ -->
  <rect x="24" y="436" width="852" height="240" rx="6" fill="#111827" stroke="#475569" stroke-width="1"/>

  <text x="50" y="462" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Wiring Steps (two cables, no soldering)</text>

  <!-- Column 1: 4397 -->
  <text x="50" y="488" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Adafruit 4397 (female sockets onto the ESP32 pins):</text>

  <circle cx="60" cy="510" r="5" fill="#ef4444"/>
  <text x="72" y="514" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">1. red socket  -->  ESP32 3V3</text>

  <circle cx="60" cy="534" r="5" fill="#1e1e1e" stroke="#6b7280" stroke-width="1"/>
  <text x="72" y="538" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">2. black socket  -->  ESP32 GND (any GND pin, never EN)</text>

  <circle cx="60" cy="558" r="5" fill="#3b82f6"/>
  <text x="72" y="562" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">3. blue socket  -->  ESP32 GPIO 21 (SDA)</text>

  <circle cx="60" cy="582" r="5" fill="#eab308"/>
  <text x="72" y="586" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">4. yellow socket  -->  ESP32 GPIO 22 (SCL)</text>

  <!-- Column 2: QT plugs -->
  <text x="470" y="488" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">STEMMA QT plugs:</text>
  <text x="480" y="514" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">5. 4397 QT plug  -->  SHT31-D STEMMA QT port</text>
  <text x="480" y="538" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">6. Adafruit 4210 QT-QT: SHT31-D second port  -->  BH1750</text>
  <text x="480" y="562" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">7. Power: 5V USB charger + USB-A to USB-C cable</text>
  <text x="480" y="586" fill="#d1d5db" font-family="system-ui, -apple-system, sans-serif" font-size="10">    into the ESP32 (keep the charger outside the chamber)</text>

  <!-- Tip rows -->
  <text x="50" y="618" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-style="italic">Tip: the sensors sit on one I2C bus at different addresses (0x44 and 0x23), so there is no conflict. Leave their loose header strips unsoldered.</text>
  <text x="50" y="638" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-style="italic">ESP32-S3 board? Different pins: SDA = GPIO 8, SCL = GPIO 9 (env node_esp32s3 / node_esp32s3_n32r16v). See the build guide, section 8a.</text>
  <text x="50" y="658" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-style="italic">The Pi and the Tasmota plug need zero wires -- they reach each other and the ESP32 over WiFi.</text>


  <!-- ═══════════════════════ FOOTER ═══════════════════════ -->
  <text x="450" y="690" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="9">SporePrint  |  Tier 1: Bare Bones  |  github.com/59psi/SporePrint</text>

</svg>
