  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- DATA FLOW SUMMARY (bottom) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="40" y="644" width="920" height="44" rx="6" fill="#111827" stroke="#475569" stroke-width="0.5"/>
  <text x="62" y="662" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Data Flow:</text>
  <text x="142" y="662" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Sensors --> MQTT --> Pi (ingest, store, alert, automate) --> Web UI (REST; Socket.IO for other clients)</text>
  <text x="62" y="680" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Commands:</text>
  <text x="142" y="680" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">UI --> Pi --> MQTT, HMAC-signed --> ESP32 (fan speed, light level) | Pi --> plug on/off | Camera POSTs stills to the Pi REST API</text>


  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- POWER + CABLING (all tiers) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="40" y="698" width="920" height="80" rx="6" fill="#111827" stroke="#f97316" stroke-width="0.8"/>
  <text x="62" y="716" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Power + cabling (wiring diagrams + build guide for each tier):</text>
  <text x="62" y="733" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Mains: one UL-listed surge-protector power strip OUTSIDE the chamber feeds the Pi's 27 W PSU, a 5 V USB charger per ESP32 / ESP32-CAM-MB,</text>
  <text x="62" y="746" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">the Tasmota plugs and (Recommended up) the 12 V PSU → 14 AWG barrel pigtail → WAGO 221-413 / 221-415 → inline fuse per branch (relay 3 A,</text>
  <text x="62" y="759" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">lighting 5 A / 7.5 A) → both switch boards on 18 AWG red/black. Each ESP32's GND ties to its board's GND bus (common ground). Climate nodes and</text>
  <text x="62" y="772" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">cameras sit inside on 6 ft (2 m) USB cables through a grommet; the relay + lighting boards stay outside. Sensors daisy-chain over STEMMA QT.</text>

  <!-- ═══════════════════════ FOOTER ═══════════════════════ -->
