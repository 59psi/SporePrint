  <text x="384" y="518" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="8">Shelly Gen2+: MQTT prefix shellies/&lt;role&gt;</text>


  <!-- ═══════════════════════════════════════════════════════════ -->
