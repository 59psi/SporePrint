  <text x="596" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">White, Blue, Red, Far-Red</text>

  <path d="M 580 154 L 540 210" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3"/>
  <g><rect x="500" y="186" width="152" height="18" rx="4" fill="#0f2418" stroke="#34d399" stroke-width="0.5"/>
  <text x="576" y="199" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600">sporeprint/&lt;node_id&gt;/cmd/scene</text></g>

  <!-- Camera Node -->
  <rect x="740" y="86" width="172" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="826" y="110" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Camera Node(s)</text>
  <text x="826" y="130" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">ESP32-CAM · OV2640 / OV3660 / OV5640</text>
  <text x="826" y="148" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Still every 15 min · in chamber</text>

  <path d="M 775 166 Q 700 210 620 254" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3"/>
  <g><rect x="664" y="198" width="120" height="18" rx="4" fill="#0f2418" stroke="#34d399" stroke-width="0.5"/>
