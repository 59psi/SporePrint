[platformio]
default_envs = node_esp32
; Optional build helpers (scripts/fw_version.ini attaches the version
; pre-script and the image-guard post-script to [esp32_base]). A glob, so a
; tree without scripts/ — e.g. a hand-copied tree, or a Builder ZIP from an
; older Pi server (current ones ship scripts/) — still builds (version then
; falls back to "dev", and the image guard does not run).
extra_configs = scripts/*.ini

# ── Shared ESP32 device settings ────────────────────────────────
# Device envs extend this section. It is deliberately NOT the [env] base so
# the native (host) test env doesn't inherit a board/platform it can't use.
#
# Platform: pioarduino release 55.03.312-1 = Arduino-ESP32 core 3.3.12 on
# ESP-IDF 5.5.5, pinned by its immutable release URL (never the moving
# "stable" one). Core 2.0.17 / ESP-IDF 4.4 (platformio/espressif32 6.13.0) is
# end-of-life. What the 3.x port changed, and why (firmware/CHANGELOG.md has
# the long form):
#   * LEDC is addressed by pin: ledcAttachChannel(pin, 25 kHz, 10-bit, i)
#     binds bank index i to channel i (the 2.x ledcSetup/ledcAttachPin map).
#   * Task WDT: IDF 5 takes a config struct and refuses a second init —
#     sp_device/task_wdt.h reconfigures the core's watchdog.
#   * NetworkClient::setTimeout() is Stream's (ms) on 3.x and no longer
#     bounds the connect: tls_transport.h uses setConnectionTimeout().
#   * Network.hostByName() is no longer capped at 15 s:
#     sp_device/bounded_dns.h restores the cap the WDT budget counts on.
#   * The core's ArduinoOTA answers only a PBKDF2 handshake the Pi's OTA push
#     does not speak: sp_device/ota_service.cpp keeps the 2.x espota
#     exchange (sp_core/espota.h).
#
# OTA from a 2.x image (field fleet): a node keeps its 2.x bootloader and
# partition table forever, and the 2.x app receives the first 3.x image. That
# hop is supported on every board: an ESP-IDF bootloader boots apps from newer
# ESP-IDF releases (the one exception, CONFIG_ESP_SYSTEM_ESP32_SRAM1_REGION_
# AS_IRAM, is off in this SDK); every 3.x image's header (chip id, min chip
# rev v0.0, max rev unset) and segments (6, none in the 4.4 bootloader's own
# RAM — checked against IDF 4.4.7's loader) pass the 4.4.7 verifier the 2.x
# app and bootloader run; NVS keeps page format 0xfe on both sides, so every
# Preferences key survives the hop AND a rollback; the partition table binary
# is byte-identical. The 2.x bootloader has CONFIG_BOOTLOADER_APP_ROLLBACK_
# ENABLE, so a 3.x image that fails before sp_device/image_rollback.h
# confirms it still boots the previous slot. scripts/image_guard.py fails
# any build whose table drifts from the fleet's or whose image leaves less
# than 64 KiB of its app slot.
#
# Libraries are pinned to EXACT versions (deps-infra#19) — their build
# scripts run inside the build, and a caret range silently picks up whatever
# was published last. Bump deliberately, device envs and native together.
# PubSubClient 2.8 and ArduinoJson 7.4.3 build unchanged on core 3.x.
#
# C++ dialect: the framework's own (gnu++2a — C++20 with GNU extensions) for
# every source, the libraries' too (their library.json no longer forces
# -std), and the native test env matches it (-std=gnu++20). Forcing gnu++17
# onto the 3.x build is not just a style choice: below C++20, libstdc++
# declares std::string's members extern-template, and the linker resolves
# them from the prebuilt ESP-Matter archive first, dragging ~300 KB of
# Matter into the image (scripts/image_guard.py checks for it).
#
# Partition tables ship a coredump slot (v2 keeps the v1 4 MB layout
# byte-identical for OTA fleet continuity; S3 boards get their own tables).
#
# Firmware version (docs#28): scripts/fw_version.py (attached to this
# section by scripts/fw_version.ini, see extra_configs above) defines
# SPOREPRINT_FW_VERSION from the SPOREPRINT_FW_VERSION environment variable
# when set (the release workflow exports it from the firmware-vX.Y.Z tag),
# else from VERSION.txt (kept in lockstep by the parent repo's
# scripts/bump.sh), else "dev" — so a plain `pio run -t upload` heartbeats a
# real version instead of "". (v1's PROVISION_HMAC build flag is gone — v2
# provisions all secrets via the captive portal.)
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -I boards

# ── v2 unified node ─────────────────────────────────────────────
# One image replaces the v1 climate/relay/lighting trio: the channel-bank
# personality is provisioned via the captive portal and the I²C sensor set
# autodetects at boot.
[env:node_esp32]
extends = esp32_base
build_src_filter = +<node/>

# ESP32-S3-DevKitC-1 with QUAD flash: N8, N8R8, N16R8 (8 MB table; a 16 MB
# board simply leaves the upper half unused). NOT for the N32R16V — its
# octal flash needs the env below.
[env:node_esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.partitions = partitions_8mb.csv
build_src_filter = +<node/>
build_flags =
    ${esp32_base.build_flags}
    -DSP_BOARD_ESP32S3

# ESP32-S3-DevKitC-1-N32R16V (ESP32-S3-WROOM-2-N32R16V: 32 MB OCTAL flash +
# 16 MB OCTAL PSRAM, 1.8 V) — the genuine Espressif S3 board sold on Amazon.
# The node_esp32s3 image (qio_qspi SDK, quad bootloader) does not boot on it.
# This env selects the core's opi_opi SDK build (octal flash + octal PSRAM),
# the OPI bootloader (build.boot=opi; esptool writes flash mode "dout" for
# OPI parts, as the platform does automatically), 32 MB in the image header,
# and a 32 MB partition table that keeps every partition in the low 16 MB
# (see partitions_32mb.csv). Same pin map as node_esp32s3: GPIO 26-37 are
# the octal flash/PSRAM bus on this module and none of them are used; GPIO
# 47/48 are 1.8 V here and also unused.
[env:node_esp32s3_n32r16v]
extends = env:node_esp32s3
board_build.arduino.memory_type = opi_opi
board_build.boot = opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_32mb.csv
build_flags =
    ${env:node_esp32s3.build_flags}
    -DSP_BOARD_ESP32S3_N32R16V
    -DBOARD_HAS_PSRAM

# ── Camera (AI-Thinker ESP32-CAM) ───────────────────────────────
[env:cam]
extends = esp32_base
board = esp32cam
build_src_filter = +<cam/>
; The camera's XCLK runs on LEDC timer 0 / channel 0 (esp_camera, via
; ESP-IDF); scripts/image_guard.py fails the build if this image links the
; Arduino LEDC attach, whose allocator would hand that channel out again.
custom_camera_owns_ledc = yes

# ── Camera, ESP32-S3 boards (earlier BOMs' cameras) ─────────────
# The same cam image for the ESP32-S3 camera boards the BOM listed from
# 2026-04-15 to 2026-06-11. Pin maps, flash LED (none), reset button (BOOT,
# GPIO 0) and sources: boards/board_profile_esp32s3cam.h. All three carry
# octal PSRAM next to quad flash (qio_opi) and use the 8 MB table (a 16 MB
# board leaves the upper half unused). The camera owns LEDC timer 0 /
# channel 0 here too.
#
# Freenove ESP32-S3-WROOM CAM (N8R8; ESP32-S3-EYE pin map) and generic
# "ESP32-S3 CAM" boards that clone it. Serial / upload: its USB-UART port.
[env:cam_esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_8mb.csv
build_src_filter = +<cam/>
custom_camera_owns_ledc = yes
build_flags =
    ${esp32_base.build_flags}
    -DSP_BOARD_ESP32S3_CAM
    -DSP_CAM_BOARD_S3_EYE
    -DBOARD_HAS_PSRAM

# Seeed Studio XIAO ESP32S3 Sense (8 MB flash + 8 MB octal PSRAM; the
# camera on the Sense expansion board — OV2640 / OV3660 as shipped, or the
# OV5640 add-on). The board definition sets qio_opi and USB CDC on boot:
# logs and uploads go over its one USB-C port.
[env:cam_xiao_esp32s3]
extends = esp32_base
board = seeed_xiao_esp32s3
board_build.partitions = partitions_8mb.csv
build_src_filter = +<cam/>
custom_camera_owns_ledc = yes
build_flags =
    ${esp32_base.build_flags}
    -DSP_BOARD_ESP32S3_CAM
    -DSP_CAM_BOARD_XIAO_S3

# Waveshare ESP32-S3-CAM-OVxxxx (ESP32-S3R8: 8 MB octal PSRAM; 16 MB quad
# flash; OV5640 / OV3660 variants). Its only USB-C port is the S3's native
# USB, so Serial is USB CDC.
[env:cam_waveshare_s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_8mb.csv
build_src_filter = +<cam/>
custom_camera_owns_ledc = yes
build_flags =
    ${esp32_base.build_flags}
    -DSP_BOARD_ESP32S3_CAM
    -DSP_CAM_BOARD_WAVESHARE_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

# ── Native host tests ───────────────────────────────────────────
# Runs the sp_core + sp_drivers suites on the host — no ESP32, no Arduino.
# `pio test -e native`. The fixture at test/fixtures/ is a byte-identical
# copy of server/tests/fixtures/signing_vectors.json, guarded by the
# bump.sh signing-fixture parity gate.
[env:native]
platform = native
test_framework = unity
# ArduinoJson is header-only and host-compilable; the wire-contract suite
# (test_wire_contract) builds the real telemetry/heartbeat/health/alert/
# switch/logs documents from the pure sp_core builders and asserts the exact
# key set + type literals on host. (Its Arduino-named header is NOT "Arduino.h"
# — the sp_core Arduino-free CI grep matches only `include <Arduino.h>`.)
# Same exact pin as the device envs, and the same C++ dialect (C++20 with
# GNU extensions — what the 3.x framework compiles every device source at).
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=gnu++20
