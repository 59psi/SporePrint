[platformio]
default_envs = node_esp32
; Optional build helpers (scripts/fw_version.ini attaches the version
; pre-script to [esp32_base]). A glob, so a tree without scripts/ — e.g. a
; hand-copied tree, or a Builder ZIP from an older Pi server (current ones
; ship scripts/) — still builds (version then falls back to "dev").
extra_configs = scripts/*.ini

# ── Shared ESP32 device settings ────────────────────────────────
# Device envs extend this section. It is deliberately NOT the [env] base so
# the native (host) test env doesn't inherit a board/platform it can't use.
#
# Pin to the official platformio/espressif32 6.13.0 release (Arduino-ESP32
# core 2.x). The v2 code uses the core-2.x ledc API (`ledcSetup` +
# `ledcAttachPin`); audit those call sites before any platform bump that
# carries core 3.x.
#
# Libraries are pinned to EXACT versions (deps-infra#19) — their build
# scripts run inside the build, and a caret range silently picks up whatever
# was published last. Bump deliberately, device envs and native together.
#
# C++ dialect is gnu++17 image-wide: the v2 libraries are C++17 and the
# ESP32 core headers rely on GNU extensions (typeof) that a strict
# -std=c++17 disables.
#
# Partition tables ship a coredump slot (v2 keeps the v1 4 MB layout
# byte-identical for OTA fleet continuity; S3 boards get their own tables).
#
# Firmware version (docs#28): scripts/fw_version.py (attached to this
# section by scripts/fw_version.ini, see extra_configs above) defines
# SPOREPRINT_FW_VERSION from the SPOREPRINT_FW_VERSION environment variable
# when set (the release workflow exports it from the firmware-vX.Y.Z tag),
# else from VERSION.txt (kept in lockstep by the parent repo's
# scripts/bump.sh), else "dev" — so a plain `pio run -t upload` heartbeats a
# real version instead of "". (v1's PROVISION_HMAC build flag is gone — v2
# provisions all secrets via the captive portal.)
[esp32_base]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I boards

# ── v2 unified node ─────────────────────────────────────────────
# One image replaces the v1 climate/relay/lighting trio: the channel-bank
# personality is provisioned via the captive portal and the I²C sensor set
# autodetects at boot.
[env:node_esp32]
extends = esp32_base
build_src_filter = +<node/>

# ESP32-S3-DevKitC-1 with QUAD flash: N8, N8R8, N16R8 (8 MB table; a 16 MB
# board simply leaves the upper half unused). NOT for the N32R16V — its
# octal flash needs the env below.
[env:node_esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.partitions = partitions_8mb.csv
build_src_filter = +<node/>
build_flags =
    ${esp32_base.build_flags}
    -DSP_BOARD_ESP32S3

# ESP32-S3-DevKitC-1-N32R16V (ESP32-S3-WROOM-2-N32R16V: 32 MB OCTAL flash +
# 16 MB OCTAL PSRAM, 1.8 V) — the genuine Espressif S3 board sold on Amazon.
# The node_esp32s3 image (qio_qspi SDK, quad bootloader) does not boot on it.
# This env selects the core's opi_opi SDK build (octal flash + octal PSRAM),
# the OPI bootloader (build.boot=opi; esptool writes flash mode "dout" for
# OPI parts, as the platform does automatically), 32 MB in the image header,
# and a 32 MB partition table that keeps every partition in the low 16 MB
# (see partitions_32mb.csv). Same pin map as node_esp32s3: GPIO 26-37 are
# the octal flash/PSRAM bus on this module and none of them are used; GPIO
# 47/48 are 1.8 V here and also unused.
[env:node_esp32s3_n32r16v]
extends = env:node_esp32s3
board_build.arduino.memory_type = opi_opi
board_build.boot = opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_32mb.csv
build_flags =
    ${env:node_esp32s3.build_flags}
    -DSP_BOARD_ESP32S3_N32R16V
    -DBOARD_HAS_PSRAM

# ── Camera (AI-Thinker ESP32-CAM) ───────────────────────────────
[env:cam]
extends = esp32_base
board = esp32cam
build_src_filter = +<cam/>

# ── Native host tests ───────────────────────────────────────────
# Runs the sp_core + sp_drivers suites on the host — no ESP32, no Arduino.
# `pio test -e native`. The fixture at test/fixtures/ is a byte-identical
# copy of server/tests/fixtures/signing_vectors.json, guarded by the
# bump.sh signing-fixture parity gate.
[env:native]
platform = native
test_framework = unity
# ArduinoJson is header-only and host-compilable; the wire-contract suite
# (test_wire_contract) builds the real telemetry/heartbeat/health/alert/
# switch/logs documents from the pure sp_core builders and asserts the exact
# key set + type literals on host. (Its Arduino-named header is NOT "Arduino.h"
# — the sp_core Arduino-free CI grep matches only `include <Arduino.h>`.)
# Same exact pin as the device envs.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=gnu++17
