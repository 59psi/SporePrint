; Merged into platformio.ini by `[platformio] extra_configs = scripts/*.ini`.
;
; The build helpers are attached here, not in platformio.ini, so a firmware
; tree WITHOUT scripts/ still builds: the glob then matches nothing, no extra
; script is loaded, and main.cpp's "dev" version fallback applies (a
; hand-copied tree, or a Builder ZIP from a Pi running an older server). The
; Pi's current Builder ZIP bundles DO ship this file and the scripts it names:
; the server reads platformio.ini, follows extra_configs into this ini and
; bundles its extra_scripts, alongside VERSION.txt and every partitions*.csv
; (server/app/builder/models_router.py _firmware_build_files). Keep the
; references below plain relative paths inside firmware/ so that discovery
; keeps finding them, and keep both scripts in this ONE option — a second ini
; setting [esp32_base] extra_scripts would replace this list, not extend it.
;
;   pre:  fw_version.py  — embeds SPOREPRINT_FW_VERSION (docs#28)
;   post: image_guard.py — fleet partition layout, app-slot headroom, no
;                          ESP-Matter objects (fails the build otherwise)
[esp32_base]
extra_scripts =
    pre:scripts/fw_version.py
    post:scripts/image_guard.py
