; Merged into platformio.ini by `[platformio] extra_configs = scripts/*.ini`.
;
; The version pre-script (docs#28) is attached here, not in platformio.ini,
; so a firmware tree WITHOUT scripts/ still builds: the glob then matches
; nothing, no extra script is loaded, and main.cpp's "dev" fallback applies
; (a hand-copied tree, or a Builder ZIP from a Pi running an older server).
; The Pi's current Builder ZIP bundles DO ship this file and the script it
; names: the server reads platformio.ini, follows extra_configs into this ini
; and bundles its extra_scripts, alongside VERSION.txt and every
; partitions*.csv (server/app/builder/models_router.py
; _firmware_build_files). Keep the reference below a plain relative path
; inside firmware/ so that discovery keeps finding it.
[esp32_base]
extra_scripts = pre:scripts/fw_version.py
