; Merged into platformio.ini by `[platformio] extra_configs = scripts/*.ini`.
;
; The version pre-script (docs#28) is attached here, not in platformio.ini,
; so a firmware tree WITHOUT scripts/ still builds: the glob then matches
; nothing, no extra script is loaded, and main.cpp's "dev" fallback applies.
; (The Pi's Builder ZIP bundles ship platformio.ini + src/lib/boards but not
; scripts/ — a hard `extra_scripts =` line in platformio.ini would make every
; bundle build fail with "missing SConscript file".)
[esp32_base]
extra_scripts = pre:scripts/fw_version.py
