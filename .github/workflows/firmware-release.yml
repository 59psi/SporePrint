# Cuts a public GitHub Release with per-image firmware .zip artifacts when a
# tag matching `firmware-v*` is pushed (e.g. firmware-v4.2.0).
#
# This is the PUBLIC firmware release: it lives in the open-source repo so
# growers can download the built binaries directly. Firmware is built from
# this repo's own firmware/ directory — no submodule checkout needed.
#
# Untrusted-input safety: the workflow_dispatch `tag` input is moved into an
# env var before any shell use, never interpolated directly into a run:
# string. github.ref_name is bounded by the firmware-v* trigger filter and
# follows the same env-var pattern.
#
# workflow_dispatch builds the REQUESTED tag (checkout ref), not the default
# branch — the tag must already exist; its version is stamped into the images.
#
# Supply chain: the token is read-only everywhere except the release job, and
# checkouts never persist it, so PlatformIO / library build scripts in the
# build matrix cannot push tags or edit releases. Actions are pinned to commit
# SHAs (tag in the trailing comment) and PlatformIO to an exact version.

name: Firmware Release

on:
  push:
    tags:
      - "firmware-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. firmware-v4.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        env: [node_esp32, node_esp32s3, node_esp32s3_n32r16v, cam, cam_esp32s3,
              cam_xiao_esp32s3, cam_waveshare_s3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dispatch builds the requested tag; a tag push builds its own ref.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache PlatformIO toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build ${{ matrix.env }}
        working-directory: firmware
        env:
          BUILD_ENV: ${{ matrix.env }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        # Export SPOREPRINT_FW_VERSION from the firmware-vX.Y.Z tag so the
        # released binaries heartbeat a real version (nodes built without it
        # report an empty string and OTA-drift detection is blind).
        run: |
          TAG="${INPUT_TAG:-$GH_REF_NAME}"
          export SPOREPRINT_FW_VERSION="${TAG#firmware-v}"
          echo "Building $BUILD_ENV as firmware version $SPOREPRINT_FW_VERSION"
          pio run -e "$BUILD_ENV"

      - name: Package binaries
        working-directory: firmware
        env:
          BUILD_ENV: ${{ matrix.env }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/firmware-dist"
          cd ".pio/build/${BUILD_ENV}"
          zip -j "$GITHUB_WORKSPACE/firmware-dist/${BUILD_ENV}.zip" \
            firmware.bin bootloader.bin partitions.bin 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/firmware-dist/${BUILD_ENV}.zip" firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.env }}
          path: firmware-dist/${{ matrix.env }}.zip
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    # The only job that may write: it creates the release and uploads assets.
    # No checkout — it needs nothing from the repository.
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: firmware-*
          path: firmware-dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\n' "$GH_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Firmware ${{ steps.tag.outputs.tag }}
          body: |
            ESP32 firmware for SporePrint chambers (v2).

            **Two images cover everything** (a node image per board, plus
            the camera):
            - `node_esp32.zip` — unified node, ESP32-WROOM-32 (climate /
              relay / lighting; pick the personality in the setup portal).
            - `node_esp32s3.zip` — unified node, ESP32-S3-DevKitC-1 with
              quad flash (N8 / N8R8 / N16R8). Does NOT boot on the N32R16V.
              (Bench verification pending; WROOM-32 is canonical.)
            - `node_esp32s3_n32r16v.zip` — unified node,
              ESP32-S3-DevKitC-1-N32R16V (octal flash + PSRAM). Use this
              one, not `node_esp32s3.zip`, for the N32R16V board.
            - `cam.zip` — camera image, AI-Thinker ESP32-CAM (OV2640,
              OV3660 or OV5640, auto-detected).
            - `cam_esp32s3.zip`, `cam_xiao_esp32s3.zip`,
              `cam_waveshare_s3.zip` — the same camera image for the
              ESP32-S3 camera boards earlier BOMs listed (Freenove
              ESP32-S3-WROOM CAM, Seeed XIAO ESP32S3 Sense, Waveshare
              ESP32-S3-CAM-OVxxxx). No flash LED on these boards.
              (Bench verification pending.)

            Each archive contains the built `.bin` files. Flash with
            esptool, the PlatformIO `-t upload` flow, or the on-Pi OTA
            pipeline. On first boot a node opens the `SporePrint-Setup`
            WiFi portal for provisioning. OTA: push the archive that
            matches the node's board (its heartbeat `board` field) — an
            image built for another board may not boot.

            Source + build instructions:
            https://github.com/59psi/SporePrint/tree/main/firmware
          files: firmware-dist/*.zip
          fail_on_unmatched_files: true
