server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1m, which rejected every node firmware .bin (~1.1 MB)
    # and most phone photos with 413 before FastAPI saw them. The server
    # enforces its own per-endpoint caps (OTA .bin 16 MiB, contamination photo
    # 10 MiB, vision frame 20 MiB); this sits just above the largest so the
    # multipart framing fits and FastAPI's own 413 message is what surfaces.
    # server/tests/test_nginx_conf.py ties this to those constants.
    client_max_body_size 21m;

    # The dashboard switches the actuators with no login (LAN-trust), so no
    # other site may frame it: a page that did could lay decoy buttons over it
    # and turn a visitor's clicks into commands (clickjacking). Every location
    # without an add_header of its own inherits these two; nginx drops them in
    # a location that sets any add_header, so the two below repeat them.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # The dashboard's routes fall back to index.html. "no-cache" has the
    # browser revalidate it every time (a 304 on its ETag), so after a Pi
    # update it loads the new bundle at once instead of a cached index.html
    # that still names the old one.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Vite's bundles are content-hashed: a name never changes content, so they
    # are cached for good. A missing one (an old chunk a page open since before
    # an update asks for) is a 404, not index.html served in its place, which
    # the browser would reject as a script with a module MIME-type error.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # nginx is the LAN edge, so the client address is set (not appended to a
    # client-supplied X-Forwarded-For). uvicorn trusts these headers only from
    # the compose network (FORWARDED_ALLOW_IPS in server/Dockerfile).
    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Synchronous Claude calls (transcript analysis) can outlast the 60 s
        # default and would otherwise surface as a 504.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # A Builder guide may run to 32,000 output tokens (_GUIDE_MAX_TOKENS in
    # server/app/builder/service.py, thinking included), and the server sends
    # nothing until it is generated and saved: at 180 s nginx answered 504
    # while the server went on to save the guide, and a retry paid for a
    # second one. The headers are repeated because a location that sets any
    # proxy_set_header inherits none from /api/.
    location = /api/builder/guide {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /socket.io/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
